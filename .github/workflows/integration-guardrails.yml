name: Integration guardrails

on:
  pull_request:
  push:
    branches: ['integration/**']
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integration-guardrails-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  integration-guardrails:
    name: integration-guardrails
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tools/integration-guards
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tools/integration-guards/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: failure()
        with:
          name: integration-guardrails-failure
          path: |
            tools/integration-guards/playwright-report/
            tools/integration-guards/test-results/
          retention-days: 7
