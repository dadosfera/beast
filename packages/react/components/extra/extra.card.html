<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<style>body{padding:16px;background:var(--background-basic-color-1)}.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:12px}.lbl{font-size:11px;font-weight:700;color:var(--text-hint-color);text-transform:uppercase;letter-spacing:.04em;width:100%}</style></head><body><div id="root"></div>
<script type="text/babel">
const DS = window.BeastDadosferaDesignSystem_d7d0ae;

const { Pagination, TreeGrid, Chat, Search, Badge } = DS;
function App(){ const [msgs,setMsgs]=React.useState([{message:'Olá! Como posso ajudar?',sender:'Suporte',date:'10:20'},{message:'Preciso reprocessar o pipeline de vendas.',sender:'Você',reply:true,date:'10:21'}]); return <>
<div className="lbl">Pagination</div><Pagination totalCount={128} pageSize={10} defaultPage={3} showPageSizeOptions />
<div className="lbl" style={{marginTop:12}}>Tree grid</div>
<div style={{border:'1px solid var(--border-basic-color-4)',borderRadius:4,overflow:'hidden'}}><TreeGrid columns={[{key:'name',title:'Nome',sortable:true,filter:true},{key:'rows',title:'Linhas',sortable:true},{key:'status',title:'Status',render:(d)=><Badge text={d.status} status={d.status==='ok'?'success':'warning'} />}]} rows={[{data:{name:'vendas',rows:12400,status:'ok'},expanded:true,children:[{data:{name:'vendas_2024',rows:4000,status:'ok'}},{data:{name:'vendas_2023',rows:8400,status:'atrasado'}}]},{data:{name:'clientes',rows:980,status:'ok'}}]} /></div>
<div className="row" style={{alignItems:'flex-start',marginTop:12}}>
<div style={{width:380}}><div className="lbl">Chat</div><Chat title="Suporte Dadosfera" status="primary" size="small" messages={msgs} onSend={(t)=>setMsgs([...msgs,{message:t,sender:'Você',reply:true}])} /></div>
<div><div className="lbl">Search (click)</div><Search /></div>
</div>
</>; }
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
