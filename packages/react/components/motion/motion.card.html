<!-- @dsCard group="Components" viewport="700x640" name="Motion: Reveal, Stagger, MotionStage, Deck" subtitle="Entrances and stagger, a stage that reveals sub-scenes, and a slide deck with reveal-by-scenes toggle and replay" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><title>components/motion/motion.card.html</title><link rel="stylesheet" href="../../../design-system/styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/eva-icons@1.1.3/eva.min.js"></script>
<script src="../../../design-system/assets/icons/custom-icons.js"></script>
<script src="../../../design-system/_ds_bundle.js"></script>
<style>body{padding:16px;background:var(--background-basic-color-1)}.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:12px}.lbl{font-size:11px;font-weight:700;color:var(--text-hint-color);text-transform:uppercase;letter-spacing:.04em;width:100%}.tile{flex:1;min-width:88px;padding:var(--space-3) var(--space-4);border:1px solid var(--border-basic-color-4);border-radius:var(--border-radius-large);background:var(--background-basic-color-1);color:var(--color-basic-1100);font-size:var(--text-subtitle-2-font-size);font-weight:var(--text-subtitle-2-font-weight);line-height:var(--text-subtitle-2-line-height)}.tile small{display:block;font-weight:var(--text-caption-font-weight);font-size:var(--text-caption-font-size);line-height:var(--text-caption-line-height);color:var(--text-hint-color)}.dot{flex:none;width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--color-info-500);color:var(--color-primary-900);font-weight:700}.frame{border:1px solid var(--border-basic-color-4);border-radius:var(--border-radius-large)}</style></head><body><div id="root"></div>
<script type="text/babel">
const DS = window.BeastDadosferaDesignSystem_d7d0ae;

const { Reveal, Stagger, MotionStage, Scene, Deck, Slide, Button } = DS;
function Tile({ title, note, className, style }) { return <div className={'tile ' + (className || '')} style={style}>{title}<small>{note}</small></div>; }
function App(){ return <>
<div className="lbl">Reveal · Stagger</div>
<div className="row"><Stagger variant="rise"><Tile title="Fontes" note="order 0" /><Tile title="Integração" note="order 1" /><Tile title="Modelo" note="order 2" /><Tile title="Governança" note="order 3" /><Tile title="Contexto" note="order 4" /></Stagger><Reveal variant="pop" loop="pulse" order={6} className="dot">IA</Reveal></div>
<div className="lbl">MotionStage · Scene</div>
<MotionStage mode="scenes" scenes={3} className="frame" style={{ padding: 'var(--space-3)', marginBottom: 12 }}>{({ scene, scenes, next, previous, replay, atStart, atEnd }) => <>
<div className="row"><Scene index={1} className="tile motion-hover-lift"><Reveal as="span">Cena 1</Reveal><small>entra com o estágio</small></Scene><Scene index={2} className="tile motion-hover-lift"><Reveal as="span">Cena 2</Reveal><small>próximo passo</small></Scene><Scene index={3} className="tile motion-hover-lift"><Reveal as="span">Cena 3</Reveal><small>fecha a sequência</small></Scene></div>
<div className="row" style={{ marginBottom: 0 }}><Button size="small" appearance="outline" status="primary" disabled={atStart} onClick={previous}>Cena anterior</Button><Button size="small" status="primary" disabled={atEnd} onClick={next}>Próxima cena</Button><Button size="small" appearance="ghost" status="primary" icon="refresh-outline" onClick={replay}>Repetir animações</Button><span className="caption">Cena {scene} de {scenes}</span></div>
</>}</MotionStage>
<div className="lbl">Deck · Slide · DeckNav</div>
<Deck defaultMode="scenes" className="frame" style={{ height: 300 }}>
<Slide breadcrumb="2. Metodologia › Data First" chip="Visão executiva" title="IA começa pela fundação" scenes={2} footer="Beast · motion">
<div className="row" style={{ flexWrap: 'nowrap' }}><Scene index={1} style={{ display: 'contents' }}><Stagger><Tile title="Fontes" note="camada 1" /><Tile title="Integração" note="camada 2" /><Tile title="Modelo" note="camada 3" /></Stagger></Scene><Scene index={2} style={{ display: 'contents' }}><Stagger variant="left"><Tile title="Governança" note="camada 4" /><Tile title="Contexto" note="camada 5" /></Stagger></Scene></div>
</Slide>
<Slide breadcrumb="3. Data Inception" chip="Visão executiva" title="Primeiro valor. Depois, escala." scenes={2} footer="Beast · motion">
<div className="row" style={{ flexWrap: 'nowrap' }}><Scene index={1} className="tile"><Reveal as="span">Data Inception</Reveal><small>MVP em produção</small></Scene><Scene index={2} className="tile"><Reveal as="span" variant="left">Data Journey</Reveal><small>mais usuários, sistemas e valor</small></Scene></div>
</Slide>
<Slide tone="primary" title="Agradecemos pela atenção!" scenes={1} footer="Beast · motion">
<Scene index={1}><Reveal as="p" style={{ color: 'var(--color-primary-100)' }}>Dúvidas?</Reveal></Scene>
</Slide>
</Deck>
</>; }
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script></body></html>
