<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:16px;background:#fff}.sw{display:flex;gap:6px}.sw div{flex:1;height:72px;border-radius:4px;display:flex;flex-direction:column;justify-content:flex-end;padding:6px;font-size:10px;font-weight:600;line-height:1.2}.sw span{opacity:.75;font-weight:400}.grid{display:grid;gap:12px}.k{font-size:11px;font-weight:700;color:var(--text-hint-color);text-transform:uppercase;letter-spacing:.04em;margin:0 0 6px}</style></head><body><p class="k">color-secondary</p><div class="sw"><div style="background:var(--color-secondary-50);color:#333">50<span>secondary-50</span></div><div style="background:var(--color-secondary-100);color:#333">100<span>secondary-100</span></div><div style="background:var(--color-secondary-200);color:#333">200<span>secondary-200</span></div><div style="background:var(--color-secondary-300);color:#333">300<span>secondary-300</span></div><div style="background:var(--color-secondary-400);color:#333">400<span>secondary-400</span></div><div style="background:var(--color-secondary-500);color:#fff">500<span>secondary-500</span></div><div style="background:var(--color-secondary-600);color:#fff">600<span>secondary-600</span></div><div style="background:var(--color-secondary-700);color:#fff">700<span>secondary-700</span></div><div style="background:var(--color-secondary-800);color:#fff">800<span>secondary-800</span></div><div style="background:var(--color-secondary-900);color:#fff">900<span>secondary-900</span></div></div><p class="k" style="margin-top:14px">color-auxiliary</p><div class="sw" style="max-width:320px"><div style="background:var(--color-auxiliary-1);color:#fff">1<span>#cc6d29</span></div><div style="background:var(--color-auxiliary-2);color:#fff">2<span>#cc3e29</span></div><div style="background:var(--color-auxiliary-3);color:#fff">3<span>#e10b69</span></div></div></body></html>
