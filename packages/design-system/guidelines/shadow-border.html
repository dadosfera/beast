<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:16px;background:#fff}.sw{display:flex;gap:6px}.sw div{flex:1;height:72px;border-radius:4px;display:flex;flex-direction:column;justify-content:flex-end;padding:6px;font-size:10px;font-weight:600;line-height:1.2}.sw span{opacity:.75;font-weight:400}.grid{display:grid;gap:12px}.k{font-size:11px;font-weight:700;color:var(--text-hint-color);text-transform:uppercase;letter-spacing:.04em;margin:0 0 6px}</style></head><body><div style="display:flex;gap:24px;padding:8px"><div style="width:150px;height:90px;background:#fff;box-shadow:var(--shadow);border-radius:4px;display:flex;align-items:flex-end;padding:8px" class="caption">shadow (header, sidebar, popover, toast)</div><div style="width:150px;height:90px;background:#fff;border:.0625rem solid var(--card-border-color);border-radius:var(--card-border-radius);display:flex;align-items:flex-end;padding:8px" class="caption">card: 1px basic-4, .5rem, no shadow</div><div style="width:150px;height:90px;background:#fff;border:1px solid var(--border-basic-color-6);border-radius:4px;display:flex;align-items:flex-end;padding:8px" class="caption">input: 1px basic-6 (#c8c8c8)</div><div style="width:150px;height:90px;background:#fff;border:1px solid var(--border-basic-color-4);border-radius:4px;display:flex;flex-direction:column;justify-content:space-around;padding:0 8px" class="caption"><span>divider 1px basic-3</span><hr style="border:0;border-top:var(--divider-width) var(--divider-style) var(--divider-color);margin:0"><span>between items</span></div></div></body></html>
