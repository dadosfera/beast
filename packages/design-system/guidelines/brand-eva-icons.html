<!-- @dsCard group="Brand" viewport="700x170" name="Eva Icons (default pack)" subtitle="480+ glyphs, outline style preferred (name-outline). 1.25rem default, hint color in menus/actions" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:16px;background:#fff}.sw{display:flex;gap:6px}.sw div{flex:1;height:72px;border-radius:4px;display:flex;flex-direction:column;justify-content:flex-end;padding:6px;font-size:10px;font-weight:600;line-height:1.2}.sw span{opacity:.75;font-weight:400}.grid{display:grid;gap:12px}.k{font-size:11px;font-weight:700;color:var(--text-hint-color);text-transform:uppercase;letter-spacing:.04em;margin:0 0 6px}</style></head><body><script src="https://unpkg.com/eva-icons@1.1.3/eva.min.js"></script><div id="icons" style="display:grid;grid-template-columns:repeat(14,1fr);gap:10px 6px"></div><script>const names=['home-outline','search-outline','bell-outline','settings-2-outline','person-outline','people-outline','menu-2-outline','more-vertical-outline','plus-outline','trash-2-outline','edit-outline','download-outline','upload-outline','refresh-outline','checkmark-outline','close-outline','alert-triangle-outline','info-outline','chevron-down-outline','chevron-right-outline','arrow-forward-outline','calendar-outline','clock-outline','email-outline','lock-outline','eye-outline','filter-outline','grid-outline'];document.getElementById('icons').innerHTML=names.map(n=>'<div style="text-align:center"><span style="display:inline-flex;width:22px;height:22px;color:var(--text-hint-color)">'+eva.icons[n].toSvg({fill:'currentColor'})+'</span><div style="font-size:9px;color:var(--text-hint-color);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+n.replace('-outline','')+'</div></div>').join('')</script></body></html>
