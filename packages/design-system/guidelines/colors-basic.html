<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:16px;background:#fff}.sw{display:flex;gap:6px}.sw div{flex:1;height:72px;border-radius:4px;display:flex;flex-direction:column;justify-content:flex-end;padding:6px;font-size:10px;font-weight:600;line-height:1.2}.sw span{opacity:.75;font-weight:400}.grid{display:grid;gap:12px}.k{font-size:11px;font-weight:700;color:var(--text-hint-color);text-transform:uppercase;letter-spacing:.04em;margin:0 0 6px}</style></head><body><p class="k">color-basic — bg 1-4 = 100-400 · border 1-6 = 100-600 · text-basic = 800 · alternative bg = 800-1100</p><div class="sw"><div style="background:var(--color-basic-100);color:#333;border:1px solid var(--color-basic-400)">100</div><div style="background:var(--color-basic-200);color:#333;border:1px solid var(--color-basic-400)">200</div><div style="background:var(--color-basic-300);color:#333;border:1px solid var(--color-basic-400)">300</div><div style="background:var(--color-basic-400);color:#333;border:1px solid var(--color-basic-400)">400</div><div style="background:var(--color-basic-500);color:#333;border:1px solid var(--color-basic-400)">500</div><div style="background:var(--color-basic-600);color:#333;border:1px solid var(--color-basic-400)">600</div><div style="background:var(--color-basic-700);color:#fff;border:1px solid var(--color-basic-400)">700</div><div style="background:var(--color-basic-800);color:#fff;border:1px solid var(--color-basic-400)">800</div><div style="background:var(--color-basic-900);color:#fff;border:1px solid var(--color-basic-400)">900</div><div style="background:var(--color-basic-1000);color:#fff;border:1px solid var(--color-basic-400)">1000</div><div style="background:var(--color-basic-1100);color:#fff;border:1px solid var(--color-basic-400)">1100</div></div></body></html>
